name: FishTrail Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Run unit tests and build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out FishTrail
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Run debug unit tests
        run: bash ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: bash ./gradlew :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FishTrail-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
