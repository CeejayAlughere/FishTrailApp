name: FishTrail Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Run unit tests and build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out FishTrail
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Run debug unit tests
        run: bash ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: bash ./gradlew :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FishTrail-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  emulator-tests:
    name: Android emulator tests (API 35)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out FishTrail
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run FishTrail Android tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          script: bash ./gradlew :app:connectedDebugAndroidTest --stacktrace

      - name: Upload Android test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: FishTrail-android-test-report
          path: app/build/reports/androidTests/connected/
          if-no-files-found: warn
